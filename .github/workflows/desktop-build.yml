# Builds the ATM desktop installers (Tauri v2 shell around https://team.akaal.id).
# Run it from GitHub → Actions → "Desktop build" → Run workflow, then download the artifacts.
name: Desktop build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            artifact: ATM-windows
            path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            artifact: ATM-macos
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Only the Tauri CLI is needed: the app loads the hosted site, so Next.js isn't built here.
      - run: npm install --no-save @tauri-apps/cli@^2

      - run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
